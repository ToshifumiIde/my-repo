name: Cache
defaults:
  run:
    shell: bash
on: push
jobs:
  cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4 # キャッシュの復元と保存
        with:
          key:
            test-${{ runner.os }}-${{ github.sha }}
            # キャッシュキーの指定
            # キャッシュの生成と保存に使用する識別子
          path:
            ${{ github.workspace }}/dummy
            # キャッシュ対象のディレクトリパスを指定する
          restore-keys: | # キャッシュ失敗時のリストアキーを複数指定する
            test-${{ runner.os }}-
      - run: |
          if [[ -f "${GITHUB_WORKSPACE}/dummy" ]]; then exit 0; fi
          dd if=/dev/urandom of="${GITHUB_WORKSPACE}/dummy" bs=1M count=10
          sleep 10
      - run: ls -lh "${GITHUB_WORKSPACE}/dummy"
# キャッシュは異なるプラットフォーム（OS）毎に異なるキャッシュを用いる
# LinuxとWindowsでは同じキャッシュが使えない可能性がある、最低でもOS毎にキャッシュは分ける
