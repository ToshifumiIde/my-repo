name: Jobs Parallel
defaults:
  run:
    shell: bash
on: push
jobs: # 複数のjobを定義した場合、依存関係の設定がなければ並列実行される
  first:
    runs-on: ubuntu-latest
    steps:
      - run: sleep 10 && echo "first job"
  second:
    runs-on: ubuntu-latest
    steps:
      - run: sleep 10 && echo "second job"
  third:
    runs-on: ubuntu-latest
    steps:
      - run: sleep 10 && echo "third job"
