name: Dump
on: push
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # ローカルアクション呼び出し前にチェックアウト
      - uses: ./.github/actions/dump/ # ローカルアクションの呼び出し
        id: dump # 出力値参照のためのステップIDの呼び出し
        with:
          enable-context: "true"
      - run: echo "${DATE}"
        env:
          DATE: ${{ steps.dump.outputs.dumped-date }} # ローカルアクションのusesでid設定したoutputsの出力値のdumped-dateを指定
